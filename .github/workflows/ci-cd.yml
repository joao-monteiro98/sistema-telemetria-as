name: CI/CD Multi-Service Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Executar Testes Unitários Globais do Core
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install Root Dependencies
        run: npm install
      - name: Run Jest Unit Tests
        run: npm test

  # 2. Compilar e Build dos Microserviços (Paralelo)
  build-services:
    needs: run-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [fleet-service, report-service, notification-service]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Docker Image locally
        run: |
          cd ${{ matrix.service }}
          docker build -t system-telemetria/${{ matrix.service }}:latest .